name: Release Charts

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Chart appVersion
        id: chart
        run: |
          APPVERSION=$(grep '^appVersion:' charts/flipt-v2/Chart.yaml | awk '{print $2}' | tr -d '"'"'"'')

          if ! [[ "$APPVERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::appVersion '$APPVERSION' doesn't look like a valid version (expected vX.Y.Z)"
            exit 1
          fi

          echo "Resolved appVersionV2: $APPVERSION"
          echo "appVersionV2=$APPVERSION" >> "$GITHUB_OUTPUT"

      - name: Inline Flipt config schema
        run: |
          SCHEMA_URL="https://raw.githubusercontent.com/flipt-io/flipt/refs/tags/${{ steps.chart.outputs.appVersionV2 }}/config/flipt.schema.json"

          curl -sL --fail "$SCHEMA_URL" -o /tmp/fliptV2.schema.json

          jq --slurpfile schema /tmp/fliptV2.schema.json'.properties.flipt.properties.config = $schema[0]' \
            charts/flipt-v2/values.schema.json > charts/flipt-v2/values.schema.json.tmp

          mv charts/flipt-v2/values.schema.json.tmp charts/flipt-v2/values.schema.json

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.8.1

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          skip_existing: true
